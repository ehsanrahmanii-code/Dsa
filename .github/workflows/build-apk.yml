name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11.9 (bundles pip 24.x, avoids open_rich_spinner issue)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev \
          build-essential ccache git unzip \
          gettext autopoint

    - name: Install Buildozer and pin pip/setuptools
      run: |
        python -m pip install pip==24.3.1
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install setuptools==69.5.1

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-3119-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-3119-${{ runner.os }}-

    - name: Pre-clone and patch python-for-android
      run: |
        rm -rf ~/.buildozer/android/platform/python-for-android
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git
        cd python-for-android
        # Pin pip to 24.3.1 in build venv (pip 25+ removed open_rich_spinner)
        sed -i 's/pip install -U pip/pip install pip==24.3.1/' pythonforandroid/build.py
        echo "=== Patched build.py pip lines ==="
        grep "pip install" pythonforandroid/build.py | head -5

    - name: Build APK
      run: |
        export SETUPTOOLS_USE_DISTUTILS=stdlib

        # Background watcher: patch pip's spinners.py as soon as the venv appears
        (
          while true; do
            for SPINNER in /home/runner/work/Dsa/Dsa/.buildozer/android/platform/build-*/build/venv/lib/python3.11/site-packages/pip/_internal/cli/spinners.py; do
              if [ -f "$SPINNER" ]; then
                if ! grep -q "def open_rich_spinner" "$SPINNER" 2>/dev/null; then
                  echo "" >> "$SPINNER"
                  echo "def open_rich_spinner(*args, **kwargs):" >> "$SPINNER"
                  echo "    return open_spinner(*args, **kwargs)" >> "$SPINNER"
                  echo "[WATCHER] Patched spinners.py: $SPINNER"
                fi
              fi
            done
            sleep 0.2
          done
        ) &
        WATCHER_PID=$!

        buildozer android debug
        BUILD_EXIT=$?

        kill $WATCHER_PID 2>/dev/null || true
        exit $BUILD_EXIT

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: titan-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: Release APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.1-${{ github.run_number }}
        files: bin/*.apk
        name: TITAN APK Build ${{ github.run_number }}
        body: |
          TITAN Trading Dashboard APK
          
          Built from commit: ${{ github.sha }}
          
          ## Installation
          1. Download the .apk file to your Android phone
          2. Enable "Install from unknown sources" in settings
          3. Open the .apk file to install
          4. Launch TITAN - the dashboard will open automatically
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

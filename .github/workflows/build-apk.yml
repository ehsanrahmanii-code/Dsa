name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev \
          build-essential ccache git unzip \
          gettext autopoint uuid-dev

    - name: Install Buildozer
      run: |
        python -m pip install pip==24.3.1
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install setuptools==69.5.1

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-3119-v2024-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-3119-v2024-${{ runner.os }}-

    - name: Pre-download and patch p4a v2024.01.21
      run: |
        rm -rf ~/.buildozer/android/platform/python-for-android
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        # Download p4a v2024.01.21 (stable release with Python 3.11 + AAB support)
        wget -q https://github.com/kivy/python-for-android/archive/refs/tags/v2024.01.21.tar.gz -O p4a.tar.gz
        tar xzf p4a.tar.gz
        mv python-for-android-2024.01.21 python-for-android
        rm p4a.tar.gz
        cd python-for-android
        # Pin pip to 24.3.1 in build venv
        sed -i 's/pip install -U pip/pip install pip==24.3.1/' pythonforandroid/build.py
        # Patch python3 recipe to disable _uuid module (libuuid not available in Android NDK)
        python3 /home/runner/work/Dsa/Dsa/patch_uuid.py
        echo "=== Patched python3 recipe to disable _uuid ==="

    - name: Build APK
      run: |
        export SETUPTOOLS_USE_DISTUTILS=stdlib
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: titan-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: Release APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.1-${{ github.run_number }}
        files: bin/*.apk
        name: TITAN APK Build ${{ github.run_number }}
        body: |
          TITAN Trading Dashboard APK
          
          Built from commit: ${{ github.sha }}
          
          ## Installation
          1. Download the .apk file to your Android phone
          2. Enable "Install from unknown sources" in settings
          3. Open the .apk file to install
          4. Launch TITAN - the dashboard will open automatically
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

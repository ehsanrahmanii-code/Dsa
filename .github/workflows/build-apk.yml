name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev \
          build-essential ccache git unzip \
          gettext autopoint

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install setuptools==69.5.1

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Patch p4a and create pip compatibility shim
      run: |
        # Remove cached p4a and re-clone fresh
        rm -rf ~/.buildozer/android/platform/python-for-android
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git
        cd python-for-android

        # Patch 1: Pin pip to 24.3.1 in build venv (avoids open_rich_spinner removal in pip 25+)
        sed -i 's/pip install -U pip/pip install pip==24.3.1/' pythonforandroid/build.py

        # Patch 2: Create a sitecustomize.py shim that adds open_rich_spinner back
        # This runs in the build venv's Python and fixes the ImportError
        # We place it where the build venv will pick it up via PYTHONPATH
        mkdir -p /home/runner/.p4a_shim
        cat > /home/runner/.p4a_shim/sitecustomize.py << 'EOF'
        import sys
        import importlib

        # Monkey-patch pip to add back open_rich_spinner if missing
        try:
            from pip._internal.cli import spinners
            if not hasattr(spinners, 'open_rich_spinner'):
                # open_rich_spinner was removed in pip 25+, alias to open_spinner
                spinners.open_rich_spinner = getattr(spinners, 'open_spinner', lambda *a, **kw: None)
        except ImportError:
            pass
        EOF

        # Set PYTHONPATH to include our shim directory
        echo "PYTHONPATH=/home/runner/.p4a_shim" >> $GITHUB_ENV

        echo "=== Patched build.py pip lines ==="
        grep "pip install" pythonforandroid/build.py | head -5
        echo "=== Created sitecustomize.py shim ==="
        cat /home/runner/.p4a_shim/sitecustomize.py

    - name: Build APK
      run: |
        export PYTHONPATH=/home/runner/.p4a_shim:$PYTHONPATH
        export SETUPTOOLS_USE_DISTUTILS=stdlib
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: titan-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: Release APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.1-${{ github.run_number }}
        files: bin/*.apk
        name: TITAN APK Build ${{ github.run_number }}
        body: |
          TITAN Trading Dashboard APK
          
          Built from commit: ${{ github.sha }}
          
          ## Installation
          1. Download the .apk file to your Android phone
          2. Enable "Install from unknown sources" in settings
          3. Open the .apk file to install
          4. Launch TITAN - the dashboard will open automatically
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

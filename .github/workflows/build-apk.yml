name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        ANDROID_HOME: /home/user/.buildozer/android/platform/android-sdk
        ANDROID_NDK_HOME: /home/user/.buildozer/android/platform/android-ndk-r28c

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install additional system dependencies
      run: |
        apt-get update -y
        apt-get install -y gettext autopoint

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: titan-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: Release APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.1-${{ github.run_number }}
        files: bin/*.apk
        name: TITAN APK Build ${{ github.run_number }}
        body: |
          TITAN Trading Dashboard APK
          
          Built from commit: ${{ github.sha }}
          
          ## Installation
          1. Download the .apk file to your Android phone
          2. Enable "Install from unknown sources" in settings
          3. Open the .apk file to install
          4. Launch TITAN - the dashboard will open automatically
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
